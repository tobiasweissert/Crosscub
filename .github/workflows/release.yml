name: Compile Release
on:
  push:
    tags:
      - "crosscub-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact numeric version already committed on main (e.g. 1.6.5.4)"
        required: true
        type: string
      publish:
        description: "OWNER APPROVAL: publish qualified Sticky release as stable GitHub /latest"
        required: true
        type: boolean
        default: false

# Serialize all stable release operations, including tag events generated by
# owner dispatch. Existing releases are refused rather than redrafted/replaced.
concurrency:
  group: crosscub-owner-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  INPUT_VERSION: ${{ inputs.version }}
  PUBLISH_RELEASE: ${{ inputs.publish && 'true' || 'false' }}

jobs:
  prepare-release:
    if: github.repository == 'tobiasweissert/Crosscub'
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      skip_release: ${{ steps.version.outputs.skip_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install pinned OTA test Core prerequisite
        run: python3 -m pip install "pioarduino==6.1.19"
      - name: Release tooling regression tests (synthetic images, never firmware)
        run: python3 -m unittest discover -s test/ota_release -v
      - name: Qualify owner source, version and release target
        id: version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          python3 scripts/prepare_ota_release.py --ci-check

  build-release:
    needs: prepare-release
    if: needs.prepare-release.outputs.skip_release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          # Never cache PlatformIO's runner-specific Python environment.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
      - name: Pin nested core and verify source toolchain pins
        run: |
          set -euo pipefail
          pio pkg install -e sticky
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          python3 - <<'PY'
          import configparser, pathlib, subprocess
          c = configparser.ConfigParser(interpolation=None)
          c.read('platformio.ini')
          assert '/55.03.311/' in c['base']['platform']
          assert subprocess.check_output(['git', 'ls-tree', 'HEAD', 'freeink-sdk'], text=True).split()[2] == '634a3f8c067a3714a6a7c622015138af096ab5d2'
          assert subprocess.check_output(['git', '-C', 'freeink-sdk', 'rev-parse', 'HEAD'], text=True).strip() == '634a3f8c067a3714a6a7c622015138af096ab5d2'
          for exe in ['pio', str(pathlib.Path.home()/'.platformio/penv/bin/pio')]:
              assert '6.1.19' in subprocess.check_output([exe, '--version'], text=True)
          PY

      # Source INI versions must already match. Do not rewrite approved source
      # in CI or derive descriptor identity from a display/provenance suffix.
      - name: Build Crosscub Sticky
        id: firmware
        env:
          CROSSSMUDGE_RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
          CROSSINK_RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
        run: |
          set -euo pipefail
          # Compiler diagnostics are public; only validated BIN/report may be uploaded.
          umask 077
          pio run -j1 -e sticky 2>&1 | tee release-build.log
      - name: Validate exact OTA image before artifact upload
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
        run: |
          mkdir -p release-qualified
          python3 scripts/validate_ota_release.py --version "$RELEASE_VERSION" \
            --firmware ".pio/build/sticky/crosscub-sticky-v$RELEASE_VERSION.bin" \
            --report release-qualified/ota-validation.json
          cp ".pio/build/sticky/crosscub-sticky-v$RELEASE_VERSION.bin" release-qualified/
      - name: Upload qualified firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-firmware-sticky
          path: |
            release-qualified/crosscub-sticky-v${{ needs.prepare-release.outputs.release_version }}.bin
            release-qualified/ota-validation.json
          if-no-files-found: error

  publish-release:
    needs: [prepare-release, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
      GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_PAT || github.token }}
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Download qualified firmware artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-firmware-sticky
          path: release-firmware
          merge-multiple: true
      - name: Revalidate and create new draft or explicitly approved stable release
        run: |
          git fetch origin main:refs/remotes/origin/main
          python3 scripts/prepare_ota_release.py "$RELEASE_VERSION" \
            --ci-upload "release-firmware/crosscub-sticky-v$RELEASE_VERSION.bin"
      # Catalog publication is meaningful only after stable GitHub publication.
      # Draft-only runs must not advertise an unavailable firmware URL.
      - name: Generate stable catalog
        if: inputs.publish
        run: |
          python3 scripts/generate_release_catalog.py --version "$RELEASE_VERSION" \
            --repo tobiasweissert/Crosscub \
            --firmware "release-firmware/crosscub-sticky-v$RELEASE_VERSION.bin" \
            --output .pio/build/catalog
