name: CI (build)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cold_qualification:
        description: Non-distributing cold Sticky qualification (no publication)
        type: boolean
        default: false
      environment:
        description: Non-distributing build environment
        type: choice
        options: [sticky, sticky-static-builtins-experimental]
        default: sticky
        required: true
  workflow_call:

# A newer commit supersedes older PR validation; keep main pushes independent.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    # The pinned analyzer requires PCRE1, absent from ubuntu-26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pinned analyzer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcre3
          python3 -c 'import ctypes; ctypes.CDLL("libpcre.so.3")'

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          # Do not cache PlatformIO's Python virtual environment. It is tied to
          # the runner's Python and can become invalid when restored elsewhere.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ubuntu24-cppcheck-${{ runner.arch }}-platformio-py3.14-core6.1.19-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Pin nested core and verify source toolchain pins
        run: |
          set -euo pipefail
          pio pkg install -e sticky
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          python3 - <<'PY'
          import configparser, pathlib, subprocess
          c = configparser.ConfigParser(interpolation=None)
          c.read('platformio.ini')
          assert '/55.03.311/' in c['base']['platform']
          assert subprocess.check_output(['git', 'ls-tree', 'HEAD', 'freeink-sdk'], text=True).split()[2] == '634a3f8c067a3714a6a7c622015138af096ab5d2'
          assert subprocess.check_output(['git', '-C', 'freeink-sdk', 'rev-parse', 'HEAD'], text=True).strip() == '634a3f8c067a3714a6a7c622015138af096ab5d2'
          for exe in ['pio', str(pathlib.Path.home()/'.platformio/penv/bin/pio')]:
              assert '6.1.19' in subprocess.check_output([exe, '--version'], text=True)
          PY

      - name: Run cppcheck
        id: analyzer
        run: |
          set -euo pipefail
          umask 077
          export CROSSCUB_PRIVATE_EVIDENCE="$GITHUB_WORKSPACE/cppcheck-evidence"
          mkdir -p "$CROSSCUB_PRIVATE_EVIDENCE"
          python3 scripts/ci_cppcheck_capture.py check --verbose --fail-on-defect low --fail-on-defect medium --fail-on-defect high 2>&1 | tee cppcheck-evidence/check.log

  build:
    # Standard Sticky uses approved packing; the manual compatibility alias is equivalent.
    # Neither environment publishes or authorizes hardware execution.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ["${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'sticky' }}"]
    env:
      PIO_ENV: ${{ matrix.environment }}
      COLD_QUALIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.cold_qualification == true }}
    steps:
      - name: Validate selected build environment
        run: |
          set -euo pipefail
          if test "${COLD_QUALIFICATION:-false}" = true && test "$PIO_ENV" != sticky; then
            printf '%s\n' 'Cold qualification requires exact sticky environment' >&2
            exit 1
          fi
          case "$PIO_ENV" in
            sticky|sticky-static-builtins-experimental) ;;
            *) printf '%s\n' 'Invalid build environment' >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.cold_qualification == true) }}
        uses: actions/cache@v4
        with:
          # Do not cache PlatformIO's Python virtual environment. It is tied to
          # the runner's Python and can become invalid when restored elsewhere.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Admit fresh cold Sticky state before resolver
        if: github.event_name == 'workflow_dispatch' && inputs.cold_qualification == true
        run: |
          set -euo pipefail
          umask 077
          mkdir -p sticky-evidence
          python3 -B scripts/check_sticky_cold_state.py fresh > sticky-evidence/cold-fresh.json

      - name: Pin nested core and verify source toolchain pins
        run: |
          set -euo pipefail
          pio pkg install -e "$PIO_ENV"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          python3 - <<'PY'
          import configparser, pathlib, subprocess
          c = configparser.ConfigParser(interpolation=None)
          c.read('platformio.ini')
          assert '/55.03.311/' in c['base']['platform']
          assert subprocess.check_output(['git', 'ls-tree', 'HEAD', 'freeink-sdk'], text=True).split()[2] == '634a3f8c067a3714a6a7c622015138af096ab5d2'
          assert subprocess.check_output(['git', '-C', 'freeink-sdk', 'rev-parse', 'HEAD'], text=True).strip() == '634a3f8c067a3714a6a7c622015138af096ab5d2'
          for exe in ['pio', str(pathlib.Path.home()/'.platformio/penv/bin/pio')]:
              assert '6.1.19' in subprocess.check_output([exe, '--version'], text=True)
          PY

      - name: Admit coherent outer and nested cold Core roots
        if: github.event_name == 'workflow_dispatch' && inputs.cold_qualification == true
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/check_sticky_cold_state.py coherent > sticky-evidence/cold-coherent.json

      - name: Test offline cold qualification contract
        run: python3 -B -m unittest discover -s test/ota_release -p test_cold_qualification.py -v

      - name: Test readable diagnostics and artifact boundary
        run: python3 -m unittest discover -s test/ota_release -p test_artifact_privacy.py -v

      - name: Record approved source before build
        run: |
          set -euo pipefail
          mkdir -p sticky-evidence
          git rev-parse HEAD > sticky-evidence/source-sha.txt
          git ls-tree -r HEAD > sticky-evidence/source-tree.txt
          git submodule status --recursive > sticky-evidence/sdk-status.txt
          git diff --binary HEAD > sticky-evidence/source-before-build.patch
          cp platformio.ini partitions.csv sticky-evidence/
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          hashes = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files if p and pathlib.Path(p).is_file()}
          pathlib.Path('sticky-evidence/source-manifest.json').write_text(json.dumps(hashes, indent=2)+'\n')
          PY

      - name: Build ${{ matrix.environment }} firmware
        id: firmware
        env:
          # Collect independent compiler failures without treating any as success.
          SCONSFLAGS: --keep-going
        run: |
          set -euo pipefail
          # Compiler diagnostics are public; staged ELF/map/config evidence stays on the runner.
          umask 077
          export CROSSCUB_PRIVATE_EVIDENCE="$GITHUB_WORKSPACE/sticky-evidence"
          export CROSSCUB_PROJECT_SCRIPTS="$GITHUB_WORKSPACE/scripts"
          : > "pio-$PIO_ENV.log"
          python3 scripts/ci_producer_capture.py --producer "$HOME/.platformio/platforms/espressif32/builder/frameworks/espidf.py" 2>&1 | tee "pio-$PIO_ENV.log"
          pio run --verbose -j1 -e "$PIO_ENV" 2>&1 | tee -a "pio-$PIO_ENV.log"

      - name: Stage exact Sticky BIN ELF and provenance
        if: always() && steps.firmware.outcome != 'skipped'
        id: qualify
        run: |
          set -euo pipefail
          mkdir -p sticky-evidence
          cp "pio-$PIO_ENV.log" sticky-evidence/build.log
          # Preserve primary bytes before any metadata command can fail.
          for name in firmware.bin firmware.elf firmware.map bootloader.bin partitions.bin; do
            if test -f ".pio/build/$PIO_ENV/$name"; then
              cp ".pio/build/$PIO_ENV/$name" sticky-evidence/
            fi
          done
          trap 'test -f sticky-evidence/image-validation.json || printf "{\"valid\":false,\"error\":\"provenance collection failed\",\"publication_authorized\":false}\\n" > sticky-evidence/image-validation.json' EXIT
          startup_capture_status=0
          python3 scripts/capture_sticky_startup_config.py --require-producer \
            --project . --env "$PIO_ENV" --memory-type qio_opi \
            --out sticky-evidence || startup_capture_status=$?
          git diff --binary HEAD > sticky-evidence/source-after-build.patch
          git -C freeink-sdk diff --binary HEAD > sticky-evidence/sdk-after-build.patch
          git -C freeink-sdk ls-tree -r HEAD > sticky-evidence/sdk-tree.txt
          pio pkg list -e "$PIO_ENV" > sticky-evidence/resolved-packages.txt
          python3 - <<'PY'
          import configparser, hashlib, json, os, pathlib, shutil, subprocess, sys
          sys.path.insert(0, 'scripts')
          from validate_ota_release import validate_release, validate_version
          out = pathlib.Path('sticky-evidence')
          config = configparser.ConfigParser(interpolation=None)
          config.read('platformio.ini')
          version = validate_version(config['crosssmudge']['version'])
          assert config['crossink']['version'] == version
          selected_env = os.environ['PIO_ENV']
          assert selected_env in ('sticky', 'sticky-static-builtins-experimental')
          build = pathlib.Path('.pio/build')/selected_env
          (out/'build-environment.json').write_text(json.dumps({'environment': selected_env, 'hardware_board': 'Sticky', 'publication_authorized': False}, indent=2)+'\n')
          for name in ['firmware.bin', 'firmware.elf', 'firmware.map', 'bootloader.bin', 'partitions.bin']:
              if (build/name).is_file(): shutil.copy2(build/name, out/name)
          # Copy, never rebuild or patch descriptor bytes for validation.
          canonical = out/('crosscub-sticky-v'+version+'.bin')
          if (out/'firmware.bin').is_file(): shutil.copy2(out/'firmware.bin', canonical)
          manifests = {}
          for root, pattern in [(pathlib.Path.home()/'.platformio/packages', '*/package.json'), (pathlib.Path.home()/'.platformio/platforms', '*/platform.json')]:
              for path in sorted(root.glob(pattern)):
                  manifests[str(path)] = {'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'manifest': json.loads(path.read_text())}
          cores = {}
          for exe in ['pio', str(pathlib.Path.home()/'.platformio/penv/bin/pio')]:
              cores[exe] = subprocess.check_output([exe, '--version'], text=True).strip()
          compilers = {}
          for path in sorted((pathlib.Path.home()/'.platformio/packages').glob('toolchain*/bin/*-g++')):
              compilers[str(path)] = {'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'version': subprocess.check_output([str(path), '--version'], text=True)}
          (out/'toolchain-manifest.json').write_text(json.dumps({'cores': cores, 'packages': manifests, 'compilers': compilers}, indent=2)+'\n')
          def capture_merged_initializer(compilers, out, elf):
              # This run only: bounded private diagnostic, not constructor closure.
              import selectors, shlex, time
              symbol = '_sub_I_65535_0$0'
              cap = 128 * 1024
              output = out/'merged-initializer.txt'
              output.write_bytes(b'')
              def collect(command, timeout, status):
                  # One bounded private stream; EOF does not imply process exit.
                  data = bytearray()
                  proc = None
                  deadline = time.monotonic()+timeout
                  status.update(exit_code=None, overflow=False, timed_out=False)
                  try:
                      proc = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                      with selectors.DefaultSelector() as selector:
                          selector.register(proc.stdout, selectors.EVENT_READ)
                          while len(data) <= cap:
                              remaining = deadline-time.monotonic()
                              if remaining <= 0 or not selector.select(remaining):
                                  status['timed_out'] = True
                                  break
                              chunk = os.read(proc.stdout.fileno(), min(8192, cap+1-len(data)))
                              if not chunk:
                                  break
                              data.extend(chunk)
                      status['overflow'] = len(data) > cap
                      if not status['timed_out'] and not status['overflow']:
                          try:
                              status['exit_code'] = proc.wait(timeout=max(0, deadline-time.monotonic()))
                          except subprocess.TimeoutExpired:
                              status['timed_out'] = True
                  except Exception as exc:
                      status['error'] = str(exc)
                  finally:
                      if proc is not None:
                          try:
                              if proc.poll() is None:
                                  proc.kill()
                              status['exit_code'] = proc.wait(timeout=5)
                          except (OSError, subprocess.SubprocessError) as exc:
                              status['error'] = str(exc)
                          finally:
                              if proc.stdout is not None:
                                  proc.stdout.close()
                  return bytes(data[:cap])
              receipt = {'complete': False, 'symbol': symbol, 'cap_bytes': cap, 'command': [], 'exit_code': None}
              try:
                  receipt['elf_sha256'] = hashlib.sha256(elf.read_bytes()).hexdigest()
                  environment = os.environ.get('PIO_ENV')
                  if environment not in ('sticky', 'sticky-static-builtins-experimental'):
                      raise ValueError('validated build environment missing')
                  linked_output = '.pio/build/'+environment+'/firmware.elf'
                  selected = []
                  for line in (out/'build.log').read_text(errors='replace').splitlines():
                      if linked_output not in line:
                          continue
                      args = shlex.split(line)
                      if not args or args[0] not in compilers or pathlib.Path(args[0]).name not in ('xtensa-esp-elf-g++', 'xtensa-esp32-elf-g++', 'xtensa-esp32s3-elf-g++'):
                          continue
                      if '-c' in args or args.count('-o') != 1:
                          continue
                      position = args.index('-o')
                      if position+1 < len(args) and args[position+1] == linked_output:
                          selected.append(args[0])
                  if len(selected) != 1:
                      raise ValueError('actual final ELF link driver not uniquely captured')
                  compiler = selected[0]
                  receipt.update(compiler_selection='captured final ELF link driver', linked_output=linked_output, environment=environment)
                  tool = pathlib.Path(compiler).with_name(pathlib.Path(compiler).name[:-3]+'objdump')
                  receipt.update(compiler=compiler, compiler_identity=compilers[compiler], objdump=str(tool))
                  receipt['objdump_sha256'] = hashlib.sha256(tool.read_bytes()).hexdigest()
                  version_status = {}
                  receipt['version_status'] = version_status
                  version = collect([str(tool), '--version'], 10, version_status)
                  receipt['objdump_version'] = version.decode(errors='replace')
                  receipt['objdump_version_sha256'] = hashlib.sha256(version).hexdigest()
                  if version_status.get('error') or version_status['timed_out'] or version_status['overflow'] or version_status['exit_code'] != 0:
                      raise ValueError('objdump version failed/overflow/timeout; consumer gate remains open')
                  command = [str(tool), '-d', '-r', '-l', '--disassemble='+symbol, str(elf)]
                  receipt['command'] = command
                  data = collect(command, 20, receipt)
                  output.write_bytes(data)
                  receipt['complete'] = not receipt.get('error') and not receipt['timed_out'] and not receipt['overflow'] and receipt['exit_code'] == 0 and ('<'+symbol+'>:').encode() in data
                  if not receipt['complete']:
                      receipt['error'] = 'failed/missing symbol/overflow/timeout; consumer gate remains open'
              except (OSError, ValueError, subprocess.SubprocessError) as exc:
                  receipt['error'] = str(exc)
              receipt['output_sha256'] = hashlib.sha256(output.read_bytes()).hexdigest()
              (out/'merged-initializer-receipt.json').write_text(json.dumps(receipt, indent=2)+'\n')
          capture_merged_initializer(compilers, out, out/'firmware.elf')
          valid = False
          try:
              report = validate_release(canonical, version)
              report.update(valid=True, publication_authorized=False)
              valid = (out/'firmware.elf').is_file() and bool(compilers)
          except (ValueError, OSError) as exc:
              report = {'valid': False, 'error': str(exc), 'publication_authorized': False}
          (out/'image-validation.json').write_text(json.dumps(report, indent=2)+'\n')
          hashes = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()}
          (out/'artifact-sha256.json').write_text(json.dumps(hashes, indent=2)+'\n')
          if not valid: raise SystemExit('BIN/ELF/toolchain qualification failed; preserve diagnostic artifact')
          PY
          test "$startup_capture_status" -eq 0

      - name: Check portable docs and workflow policy
        run: python3 -m unittest discover -s test/crosspoint_migration/docs-ci -v

      - name: Extract firmware stats
        run: |
          echo 'Firmware size diagnostics remain private.' >> "$GITHUB_STEP_SUMMARY"

  required-tests:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check preview version, packing, Stats layout and status policy
        run: |
          set -eu
          export TMPDIR="$RUNNER_TEMP"
          python3 test/static_builtin_data/test_integration_policy.py IntegrationPolicy.test_production_packing_sdk_delta_and_raw_controls
          python3 test/reading_heatmap/render_probe.py
          python3 test/reading_heatmap/render_probe.py --sanitize
          python3 test/crosspoint_migration/docs-ci/test_preview_status.py

  test-status:
    name: Test Status
    if: always()
    needs: [build, clang-format, cppcheck, required-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require exact mandatory job results
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BUILD: ${{ needs.build.result }}
          FORMAT: ${{ needs.clang-format.result }}
          ANALYZER: ${{ needs.cppcheck.result }}
          TESTS: ${{ needs.required-tests.result }}
        run: |
          set -eu
          test "$FORMAT:$ANALYZER" = success:success
          case "$EVENT" in
            push) test "$REF:$BUILD:$TESTS" = refs/heads/main:skipped:skipped ;;
            workflow_dispatch|pull_request|workflow_call) test "$BUILD:$TESTS" = success:success ;;
            *) exit 1 ;;
          esac
